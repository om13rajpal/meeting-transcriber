[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Native error alerts (Task 8). A tray-only app has no console the user is
# watching, so a failure to start recording has to reach them some other
# way. Chosen over `rfd` because its `show()` marshals onto the platform's
# UI thread itself - `rfd`'s macOS backend is an `NSAlert` that has to be
# presented from the main thread by the caller, which every one of this
# file's error paths would have to wrap in `run_on_main_thread` by hand.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# keyring 3.x ships with zero default features - without an explicit
# platform backend feature, `Entry` silently falls back to a non-persistent
# in-memory mock store that round-trips within a process but never touches
# the real OS credential store (confirmed via `security find-generic-password`
# returning nothing after a "successful" set/get). apple-native pulls in
# security-framework (macOS Keychain); windows-native pulls in the Windows
# Credential Manager bindings. Both gate an optional dependency that's
# itself target_os-gated in the keyring crate's own Cargo.toml, so enabling
# both here is safe cross-platform.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
dirs = "5"
cpal = "0.15"
crossbeam-channel = "0.5"
hound = "3.5"
# For the post-recording upload flow (Task 6): minting an upload token and
# posting the finished WAV to the backend, both over plain HTTPS.
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
# Only used to timestamp the recording's output filename.
chrono = "0.4"

# System-audio ("loopback") capture has no cross-platform crate, so each OS
# gets its own binding, gated so the other platform's dependency never even
# resolves. See src/capture/loopback_macos.rs / loopback_windows.rs for the
# API notes taken from each crate's real source.
#
# macOS: Core Audio Process Taps (AudioHardwareCreateProcessTap +
# CATapDescription, macOS 14.2+), not ScreenCaptureKit. ScreenCaptureKit has
# no audio-only stream - it always requires a real (if thrown-away) video
# component, which is exactly why macOS gated it behind the intrusive
# "Screen & System Audio Recording" permission. A process tap captures
# system output audio directly with no video component at all, so macOS
# gates it behind the separate, narrower "System Audio Recording Only"
# permission instead - the same one apps like Wispr Flow use. This also
# drops the Swift-bridge build requirement the old screencapturekit-based
# implementation had.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-core-audio = { version = "0.3.2", features = ["AudioHardware", "block2", "dispatch2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = ["CFString", "CFArray", "CFDictionary", "CFBase"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSObject", "NSString", "NSUUID", "NSValue"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"

