summary: The 24-icon Court Reporter family. 24 grid, 1.75 stroke, butt caps, miter joins, 2px corners. currentColor throughout so one sprite serves light, dark, and accent variants.
-->
<!--
  ICON FAMILY  ·  24 icons
  ==========================================================================
  RULES, all four are load bearing:
    grid          24 x 24, 2px safe margin, optical centre over geometric
    stroke        1.75 (--cr-stroke-icon), never scaled. A 16px icon is a
                  24px icon rendered smaller, so its stroke thins optically.
                  That is intended: small icons should recede.
    terminals     butt caps. Not round. The brand is set in type and rules,
                  and round caps read soft and generic.
    joins         miter. Corners on rectangles are rx 2, matching nothing
                  smaller than --cr-radius-sm.
    fill          none, everywhere, always. This family is stroke only.

  The project ships lucide (components.json iconLibrary). These 24 are the
  brand-specific set that lucide does not cover well or covers in the wrong
  voice: waveform, transcript, merge, webhook, cost. For anything outside
  this list use lucide at strokeWidth 1.75 and it will sit in family.

  USAGE
    <svg class="cr-icon" width="20" height="20"><use href="icons.svg#cr-i-upload"/></svg>
    .cr-icon { color: var(--cr-text-muted); }
    .cr-icon[data-tone="accent"] { color: var(--cr-red-text); }

  SIZES: 16 (dense rows, inline with 11px meta), 20 (buttons, default),
  24 (empty states, section markers). No other sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: butt; stroke-linejoin: miter; }
    </style>
  </defs>

  <!-- 01 upload · the product's primary verb -->
  <symbol id="cr-i-upload" viewBox="0 0 24 24">
    <path d="M12 3.5V14.5"/><path d="M7.5 8 12 3.5 16.5 8"/><path d="M4 15.5V20.5h16V15.5"/>
  </symbol>

  <!-- 02 mic · recording, the input side -->
  <symbol id="cr-i-mic" viewBox="0 0 24 24">
    <rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>
    <path d="M12 18v3.5"/><path d="M8.5 21.5h7"/>
  </symbol>

  <!-- 03 waveform · audio before it becomes text -->
  <symbol id="cr-i-waveform" viewBox="0 0 24 24">
    <path d="M3.5 10v4"/><path d="M8 6v12"/><path d="M12 8.5v7"/><path d="M16 3.5v17"/><path d="M20.5 9v6"/>
  </symbol>

  <!-- 04 transcript · audio after it becomes text -->
  <symbol id="cr-i-transcript" viewBox="0 0 24 24">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M7.5 8h7"/><path d="M7.5 12h9"/><path d="M7.5 16h5.5"/>
  </symbol>

  <!-- 05 search · the dashboard's one search box -->
  <symbol id="cr-i-search" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20.5 20.5"/>
  </symbol>

  <!-- 06 tag · meeting tags -->
  <symbol id="cr-i-tag" viewBox="0 0 24 24">
    <path d="M3.5 3.5h8l9 9-8 8-9-9z"/><circle cx="7.75" cy="7.75" r="1.6"/>
  </symbol>

  <!-- 07 speaker · one diarised voice -->
  <symbol id="cr-i-speaker" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-4.1 3.4-6.5 7.5-6.5s7.5 2.4 7.5 6.5"/>
  </symbol>

  <!-- 08 merge · fixing Deepgram's over-split diarisation -->
  <symbol id="cr-i-merge" viewBox="0 0 24 24">
    <path d="M3.5 4.5h4l5.5 7.5"/><path d="M3.5 19.5h4L13 12"/><path d="M13 12h7"/>
    <path d="M17 8.5 20.5 12 17 15.5"/>
  </symbol>

  <!-- 09 clock · duration -->
  <symbol id="cr-i-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/><path d="M12 6.5V12l4 2.5"/>
  </symbol>

  <!-- 10 calendar · meeting date -->
  <symbol id="cr-i-calendar" viewBox="0 0 24 24">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17"/>
    <path d="M8 2.75v4"/><path d="M16 2.75v4"/>
  </symbol>

  <!-- 11 cost · the per-transcript dollar figure -->
  <symbol id="cr-i-cost" viewBox="0 0 24 24">
    <path d="M12 2.75v18.5"/>
    <path d="M16.5 7.5c0-2-2-3.25-4.5-3.25S7.5 5.5 7.5 7.5s1.9 2.9 4.5 3.75 4.5 1.75 4.5 3.75-2 3.25-4.5 3.25-4.5-1.25-4.5-3.25"/>
  </symbol>

  <!-- 12 download · export a transcript -->
  <symbol id="cr-i-download" viewBox="0 0 24 24">
    <path d="M12 3.5v11"/><path d="M7.5 10 12 14.5 16.5 10"/><path d="M4 16.5V20.5h16V16.5"/>
  </symbol>

  <!-- 13 share · the share link -->
  <symbol id="cr-i-share" viewBox="0 0 24 24">
    <path d="M14 3.5h6.5V10"/><path d="M20.5 3.5 11 13"/><path d="M17.5 14v6.5H3.5V6.5H10"/>
  </symbol>

  <!-- 14 link · a webhook destination URL -->
  <symbol id="cr-i-link" viewBox="0 0 24 24">
    <path d="M10.2 13.8a4.6 4.6 0 0 0 6.5 0l3-3a4.6 4.6 0 1 0-6.5-6.5l-1.7 1.7"/>
    <path d="M13.8 10.2a4.6 4.6 0 0 0-6.5 0l-3 3a4.6 4.6 0 1 0 6.5 6.5l1.7-1.7"/>
  </symbol>

  <!-- 15 trash · delete a meeting, single or bulk -->
  <symbol id="cr-i-trash" viewBox="0 0 24 24">
    <path d="M3.5 6.5h17"/><path d="M9.5 6.5v-3h5v3"/><path d="M5.75 6.5 7 20.5h10l1.25-14"/>
    <path d="M10 10.5v6"/><path d="M14 10.5v6"/>
  </symbol>

  <!-- 16 check · status Complete, notification delivered -->
  <symbol id="cr-i-check" viewBox="0 0 24 24">
    <path d="M4 12.5 9.5 18 20 6.5"/>
  </symbol>

  <!-- 17 close · dismiss, clear, remove a tag -->
  <symbol id="cr-i-close" viewBox="0 0 24 24">
    <path d="M5.5 5.5 18.5 18.5"/><path d="M18.5 5.5 5.5 18.5"/>
  </symbol>

  <!-- 18 alert · status Failed, an errorMessage -->
  <symbol id="cr-i-alert" viewBox="0 0 24 24">
    <path d="M12 2.75 22.25 20.75H1.75z"/><path d="M12 9.5v5"/><path d="M12 17.75v.5"/>
  </symbol>

  <!-- 19 retry · Resend notifications, retry an upload -->
  <symbol id="cr-i-retry" viewBox="0 0 24 24">
    <path d="M20.5 12a8.5 8.5 0 1 1-2.75-6.25"/><path d="M20.5 2.75V8H15.25"/>
  </symbol>

  <!-- 20 bell · email notification -->
  <symbol id="cr-i-bell" viewBox="0 0 24 24">
    <path d="M6 10.5a6 6 0 0 1 12 0c0 4.75 2 6.5 2 6.5H4s2-1.75 2-6.5z"/>
    <path d="M9.5 20a2.5 2.5 0 0 0 5 0"/>
  </symbol>

  <!-- 21 webhook · one payload, several destinations, fired in parallel -->
  <symbol id="cr-i-webhook" viewBox="0 0 24 24">
    <circle cx="12" cy="5" r="2.5"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
    <path d="M10.9 7.25 6.6 16.25"/><path d="M13.1 7.25 17.4 16.25"/><path d="M8 18.5h8"/>
  </symbol>

  <!-- 22 mail · the Resend notification email -->
  <symbol id="cr-i-mail" viewBox="0 0 24 24">
    <rect x="2.75" y="5" width="18.5" height="14" rx="2"/><path d="M2.75 7.5 12 14l9.25-6.5"/>
  </symbol>

  <!-- 23 lock · every recording stays private to your account -->
  <symbol id="cr-i-lock" viewBox="0 0 24 24">
    <rect x="4.5" y="10.5" width="15" height="10.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
  </symbol>

  <!-- 24 chevron · navigate into a meeting -->
  <symbol id="cr-i-chevron" viewBox="0 0 24 24">
    <path d="M9 4.5 16.5 12 9 19.5"/>
  </symbol>
</svg>
