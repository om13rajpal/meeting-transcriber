<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · Meeting Transcriber</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="navbar">
    <span class="brand">Meeting Transcriber</span>
    <div class="navbar-right">
      <span class="user-email" id="userEmail"></span>
      <button class="btn ghost small" id="logoutBtn" type="button">Log out</button>
    </div>
  </div>

  <div class="wrap">
    <div class="section-title" style="margin-top: 8px;">New Transcription</div>

    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload a recording">
      <div class="dropzone-inner">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <p>Drop your recording here</p>
        <p class="hint">MP4 or MP3 &middot; or click to browse</p>
      </div>
    </div>
    <input type="file" id="fileInput" accept="audio/*,video/*" hidden />

    <div class="file-info hidden" id="fileInfo">
      <div class="file-info-row">
        <span id="fileName"></span>
        <button class="btn small ghost" id="clearBtn" type="button">Clear</button>
        <button class="btn small primary" id="transcribeBtn" type="button">Transcribe</button>
      </div>
    </div>

    <div class="status hidden" id="statusBox">
      <div class="spinner"></div>
      <span id="statusText">Uploading &amp; transcribing&hellip; 0:00</span>
    </div>

    <div class="error hidden" id="errorBox"></div>

    <div class="section-title-row">
      <div class="section-title">Past Meetings</div>
      <input type="search" id="searchInput" class="search-input" placeholder="Search meetings…" aria-label="Search meetings" />
    </div>

    <div class="meeting-list hidden" id="meetingList"></div>
    <div class="empty-state hidden" id="emptyState">No meetings yet. Upload a recording above to get started.</div>
    <div class="empty-state hidden" id="noResultsState">No meetings match your search.</div>
    <div class="empty-state hidden" id="loadingState">Loading your meetings&hellip;</div>
  </div>

  <script src="/js/dashboard.js" defer></script>
</body>
</html>
