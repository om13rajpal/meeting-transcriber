<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meeting Transcriber</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236c8cff'/%3E%3Cpath d='M12 15a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Meeting Transcriber</h1>
      <p class="subtitle">Upload an MP4 or MP3 — audio is extracted automatically and transcribed with Deepgram (Hinglish-ready).</p>
    </header>

    <section id="dropzone" class="dropzone">
      <input type="file" id="fileInput" accept="video/*,audio/*,.mp4,.mp3,.wav,.m4a,.mov,.mkv" hidden />
      <div class="dropzone-inner">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p><strong>Drop your MP4 or MP3</strong> here, or click to browse</p>
        <p class="hint">Video files have their audio track extracted automatically before transcription.</p>
      </div>
    </section>

    <section id="fileInfo" class="file-info hidden">
      <div class="file-info-row">
        <span id="fileName"></span>
        <button id="startBtn" class="btn primary">Transcribe</button>
        <button id="clearBtn" class="btn ghost">Clear</button>
      </div>
    </section>

    <section id="statusBox" class="status hidden">
      <div class="spinner"></div>
      <span id="statusText">Uploading…</span>
      <span id="statusTimer">0:00</span>
    </section>

    <section id="errorBox" class="error hidden"></section>

    <section id="resultBox" class="result hidden">
      <div class="result-header">
        <div class="tabs">
          <button class="tab active" data-tab="speakers">Transcript</button>
          <button class="tab" data-tab="plain">Plain Text</button>
        </div>
        <div class="result-actions">
          <button id="copyBtn" class="btn ghost small">Copy</button>
          <select id="formatSelect" class="btn ghost small format-select" title="Download format">
            <option value="txt">.txt</option>
            <option value="srt">.srt</option>
            <option value="vtt">.vtt</option>
          </select>
          <button id="downloadBtn" class="btn ghost small">Download</button>
        </div>
      </div>
      <div id="meta" class="meta"></div>
      <div id="speakerView" class="transcript-view speaker-view"></div>
      <pre id="plainView" class="transcript-view hidden"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
