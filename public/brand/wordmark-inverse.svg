<!--
  INVERSE WORDMARK  ·  PLACEHOLDER
  ==========================================================================
  For the paper side of the brand: printed transcripts, PDF export headers,
  invoices, light-mode email templates.

  NOTE THE RED. This variant uses --cr-red-fill (#B8202D), not --cr-red
  (#E63946). On paper the brand red measures 3.70:1 and fails AA for
  anything smaller than large text. The deeper red measures 5.67:1. This is
  not an inconsistency, it is the same red at the intensity its background
  requires.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90"
     role="img" aria-label="MEETING.TXT">
  <rect width="420" height="90" fill="var(--cr-paper, #F4F1EA)"/>
  <text x="0" y="70"
        font-family="'Big Shoulders Display', 'Arial Narrow', system-ui, sans-serif"
        font-weight="900" font-size="80" letter-spacing="0.5"
        fill="var(--cr-ink, #0E0E0F)">MEETING<tspan fill="var(--cr-red-fill, #B8202D)">.</tspan>TXT</text>
</svg>
