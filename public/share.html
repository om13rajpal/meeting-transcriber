<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shared meeting · Meeting Transcriber</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236c8cff'/%3E%3Cpath d='M12 15a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <div class="share-banner">Shared, read-only view of a meeting transcript.</div>

    <h1 id="meetingTitle" class="meeting-title read-only hidden"></h1>

    <section id="notFoundBox" class="empty-state hidden">
      <p id="notFoundText">This link is invalid or has been revoked.</p>
    </section>

    <section id="resultBox" class="result hidden">
      <div class="result-header">
        <div class="tabs">
          <button class="tab active" data-tab="speakers">Transcript</button>
          <button class="tab" data-tab="plain">Plain Text</button>
        </div>
        <div class="result-actions">
          <button id="copyBtn" class="btn ghost small">Copy</button>
          <select id="formatSelect" class="btn ghost small format-select" title="Download format">
            <option value="txt">.txt</option>
            <option value="srt">.srt</option>
            <option value="vtt">.vtt</option>
          </select>
          <button id="downloadBtn" class="btn ghost small">Download</button>
        </div>
      </div>
      <div id="meta" class="meta">Loading…</div>
      <div id="speakerView" class="transcript-view speaker-view"></div>
      <pre id="plainView" class="transcript-view hidden"></pre>
    </section>
  </main>

  <script src="/js/share.js" defer></script>
</body>
</html>
