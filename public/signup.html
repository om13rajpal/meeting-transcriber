<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up · Meeting Transcriber</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236c8cff'/%3E%3Cpath d='M12 15a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Sign up</h1>
      <form id="signupForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required />
        </div>

        <div class="error hidden" id="errorBox"></div>

        <button type="submit" class="btn primary" id="submitBtn">
          <span id="submitText">Sign up</span>
          <span class="spinner btn-spinner hidden" id="submitSpinner"></span>
        </button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </main>

  <script src="/js/signup.js"></script>
</body>
</html>
